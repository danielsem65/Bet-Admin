name: Build Positive Elijoe Bet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows .

      - name: Apply custom window frame & app icon
        shell: powershell
        run: |
          Copy-Item -Force ci/windows/win32_window.cpp windows/runner/win32_window.cpp
          Copy-Item -Force ci/windows/win32_window.h windows/runner/win32_window.h
          Copy-Item -Force ci/windows/flutter_window.cpp windows/runner/flutter_window.cpp
          Copy-Item -Force ci/windows/flutter_window.h windows/runner/flutter_window.h
          Copy-Item -Force ci/windows/app_icon.ico windows/runner/resources/app_icon.ico

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=ADMIN_API_BASE=${{ secrets.ADMIN_API_BASE }} --dart-define=STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }}

      - name: Package portable app
        shell: powershell
        run: |
          Copy-Item build/windows/x64/runner/Release/bet_admin.exe "build/windows/x64/runner/Release/Positive Elijoe Bet.exe"
          Remove-Item build/windows/x64/runner/Release/bet_admin.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Positive-Elijoe-Bet-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Positive-Elijoe-Bet-Windows
          path: Positive-Elijoe-Bet-Windows.zip
